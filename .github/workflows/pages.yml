name: GitHub Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck the Pages source commit
        run: npm run typecheck

      - name: Install Chromium for the browser demo smoke
        run: npx playwright install --with-deps chromium

      - name: Build the static browser demo
        run: npx vite build
        env:
          VITE_PAGES_DEMO: 'true'

      - name: Verify the built app in Chromium
        run: node src/pages-demo/verify.mjs

      - name: Upload browser smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pages-browser-smoke-diagnostics
          path: artifacts/pages-smoke/
          if-no-files-found: ignore

      - name: Upload only the static build output
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy the uploaded Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
